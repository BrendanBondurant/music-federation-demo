# Contrafact walk: a self-edge in catalog, fanning out to discography.
# All The Things You Are carries Ablution, Bird of Paradise, and Prince Albert
# via ## Contrafacts (I Got Rhythm / How High the Moon carry their families the
# same way). Each contrafact resolves its own composer into the shared artist
# pool and its own recordings from the discography.
query AllTheThingsYouAreFamily {
  tune(id: "all-the-things-you-are") {
    title
    composer {
      name
    }
    contrafacts {
      title
      composer {
        name
      }
      recordings {
        performers {
          name
        }
        album {
          title
          year
        }
      }
    }
  }
}
